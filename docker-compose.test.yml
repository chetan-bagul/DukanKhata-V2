services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dukankhata_test
      POSTGRES_USER: dukankhata_test
      POSTGRES_PASSWORD: local-test-only
    volumes:
      - ./supabase-schema.sql:/docker-entrypoint-initdb.d/001-supabase-schema.sql:ro
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukankhata_test -d dukankhata_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/dukankhata_test
      DB_USERNAME: dukankhata_test
      DB_PASSWORD: local-test-only
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-only-test-secret-never-use-in-production-1234567890
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      RAZORPAY_KEY_ID: test-only-key
      RAZORPAY_KEY_SECRET: test-only-secret
      RAZORPAY_WEBHOOK_SECRET: test-only-webhook-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEST_APP_PORT:-18080}:8080"
    stop_grace_period: 30s
