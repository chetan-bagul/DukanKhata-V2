services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dukankhata_test
      POSTGRES_USER: dukankhata_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukankhata_test -d dukankhata_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: test
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/dukankhata_test
      DB_USERNAME: dukankhata_test
      DB_PASSWORD: local-test-only
      JPA_DDL_AUTO: update
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-only-test-secret-never-use-in-production-1234567890
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18080:8080"
    stop_grace_period: 30s
