services:
  postgres:
    image: postgres:17
    container_name: dukankhata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dukankhata
      POSTGRES_USER: ${DB_USERNAME:-dukankhata}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting local PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dukankhata_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dukankhata-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dukankhata_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  dukankhata_pgdata:
  dukankhata_redisdata:
