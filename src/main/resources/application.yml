
server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dukankhata-backend

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dukankhata}
    username: ${DB_USERNAME:dukankhata}
    password: ${DB_PASSWORD:change-this-local-only}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DukanKhataHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_TIMEOUT:200ms}

  jackson:
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:local-only-change-this-secret-to-a-random-32-byte-value}
    expiration-ms: 86400000

  rate-limit:
    login:
      capacity: 5
      refill-interval-ms: 12000
      state-ttl-ms: 120000

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

subscription:
  trial-days: ${SUBSCRIPTION_TRIAL_DAYS:30}
  plans:
    small-monthly: ${SUBSCRIPTION_SMALL_MONTHLY:150}
    small-yearly: ${SUBSCRIPTION_SMALL_YEARLY:1500}
    large-monthly: ${SUBSCRIPTION_LARGE_MONTHLY:199}
    large-yearly: ${SUBSCRIPTION_LARGE_YEARLY:1990}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5175}

  notification-worker:
    fixed-delay-ms: ${NOTIFICATION_WORKER_FIXED_DELAY_MS:5000}
    lease-duration-ms: ${NOTIFICATION_WORKER_LEASE_DURATION_MS:300000}
    max-attempts: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:5}

  slow-request-ms: ${SLOW_REQUEST_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,mappedSchema

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.dukankhata: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
